<head>

<style>
/* Layout: un quaderno a quadretti. Colonna unica centrata, tasti grandi per tablet; inchiostro blu per il francese, penna rossa per le correzioni. */
:root{
  --veil:rgba(18,28,60,.6); --orange:#d95f00; --orange-2:#fff1e3; --night:#2b1d45;
  --paper:#fbfcff; --grid:rgba(60,100,190,.12); --card:#ffffff; --line:#d3dcef;
  --text:#1b2335; --muted:#5b6784; --ink:#1d3a8a; --ink-2:#e8eeff;
  --red:#cf3329; --red-2:#fdeceb; --green:#1f8754; --green-2:#e5f6ed; --gold:#e3a614;
  --f-script:"Playwrite FR Moderne","Comic Sans MS",cursive;
  --f-ui:"Atkinson Hyperlegible",system-ui,-apple-system,"Segoe UI",sans-serif;
  --r:14px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --paper:#121826; --grid:rgba(140,170,240,.07); --card:#1b2334; --line:#2d3a55;
  --text:#e6ebf6; --muted:#9aa6c4; --ink:#a9c0ff; --ink-2:#22305a;
  --red:#ff7f72; --red-2:#3a1f24; --green:#5fd39a; --green-2:#173426; --gold:#f2c14a; --veil:rgba(0,0,0,.72); --orange:#ff9d47; --orange-2:#3a2614; --night:#e9dcff; color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#121826; --grid:rgba(140,170,240,.07); --card:#1b2334; --line:#2d3a55;
  --text:#e6ebf6; --muted:#9aa6c4; --ink:#a9c0ff; --ink-2:#22305a;
  --red:#ff7f72; --red-2:#3a1f24; --green:#5fd39a; --green-2:#173426; --gold:#f2c14a; --veil:rgba(0,0,0,.72); --orange:#ff9d47; --orange-2:#3a2614; --night:#e9dcff; color-scheme:dark}
[hidden]{display:none!important}
html,body{min-height:100%;margin:0}
img{max-width:100%}
body{background-color:var(--paper);background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);background-size:24px 24px;color:var(--text);font-family:var(--f-ui);font-size:18px;line-height:1.45;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:12px 40px}
.wrap{max-width:760px;margin:0 auto;display:grid;gap:20px}
header{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.brand{font-family:var(--f-script);color:var(--ink);font-size:clamp(24px,5vw,34px);line-height:1.6;cursor:pointer}
.hbtns{display:flex;gap:8px}
button{font:inherit;color:inherit;cursor:pointer}
.chip{border:1.5px solid var(--line);background:var(--card);border-radius:999px;padding:8px 14px;font-size:16px}
.chip[aria-pressed="true"]{border-color:var(--ink);background:var(--ink-2);color:var(--ink);font-weight:700}
button:focus-visible,input:focus-visible,textarea:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
h2{font-size:15px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin:0}
.units{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
@media (max-width:620px){.cards{grid-template-columns:1fr}}
.scheda{background:var(--card);border:1.5px solid var(--line);border-radius:var(--r);padding:20px 18px;text-align:left;display:grid;gap:6px;min-height:150px;align-content:start;transition:transform .15s,border-color .15s}
.scheda:hover{border-color:var(--ink);transform:translateY(-2px)}
.scheda .ico{font-size:36px;line-height:1}
.scheda .fr{font-family:var(--f-script);color:var(--ink);font-size:22px;line-height:1.7}
.scheda .it{color:var(--muted);font-size:16px}
.note{color:var(--muted);font-size:15px}
.panel{background:var(--card);border:1.5px solid var(--line);border-radius:var(--r);padding:20px}
.top{display:flex;align-items:center;gap:12px;justify-content:space-between}
.dots{display:flex;gap:6px;flex-wrap:wrap}
.dot{width:14px;height:14px;border-radius:50%;border:2px solid var(--line)}
.dot.ok{background:var(--green);border-color:var(--green)} .dot.ko{background:var(--red);border-color:var(--red)} .dot.now{border-color:var(--ink)}
.prompt{display:grid;gap:12px;justify-items:center;text-align:center;padding:8px 0 4px}
.ask{color:var(--muted);font-size:17px}
.big{font-size:84px;line-height:1.1}
.fw{font-family:var(--f-script);color:var(--ink);font-size:clamp(26px,6vw,38px);line-height:1.7}
body.print .fw, body.print .opt .fr, body.print .scheda .fr, body.print .brand{font-family:var(--f-ui);font-weight:700;line-height:1.3}
.digit{font-size:72px;font-weight:700;color:var(--ink);font-variant-numeric:tabular-nums}
.bubble{background:var(--ink-2);color:var(--text);border-radius:18px 18px 18px 4px;padding:12px 16px;max-width:520px;text-align:left}
.bubble b{color:var(--ink)}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:8px}
.opt{background:var(--card);border:2px solid var(--line);border-radius:var(--r);padding:14px 10px;min-height:84px;display:grid;place-items:center;gap:4px;text-align:center}
.opt:hover:not(:disabled){border-color:var(--ink)}
.opt .fr{font-family:var(--f-script);color:var(--ink);font-size:24px;line-height:1.7}
.opt .em{font-size:54px;line-height:1.1}
.opt.right{border-color:var(--green);background:var(--green-2)} .opt.wrong{border-color:var(--red);background:var(--red-2)}
.opt:disabled{cursor:default}
.sw{display:inline-block;width:56px;height:18px;border-radius:5px;border:1.5px solid var(--muted)}
.swbig{width:120px;height:44px;border-radius:8px}
.objc{display:grid;justify-items:center;gap:4px}
.say{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
.btn{border:none;background:var(--ink);color:var(--paper);border-radius:999px;padding:12px 22px;font-weight:700;font-size:18px}
.btn.ghost{background:transparent;color:var(--ink);border:2px solid var(--ink)}
.btn.big{font-size:22px;padding:16px 30px}
.type{display:grid;gap:10px;margin-top:8px}
.type input{font:inherit;font-size:24px;padding:12px 14px;border:2px solid var(--line);border-radius:12px;background:var(--card);color:var(--text);width:100%;box-sizing:border-box}
.keys{display:flex;gap:6px;flex-wrap:wrap}
.key{border:1.5px solid var(--line);background:var(--card);border-radius:10px;min-width:46px;padding:8px 10px;font-size:20px}
.fb{border-radius:12px;padding:14px 16px;display:grid;gap:6px}
.fb.ok{background:var(--green-2);border:1.5px solid var(--green)} .fb.ko{background:var(--red-2);border:1.5px solid var(--red)}
.fb .t{font-weight:700} .fb.ok .t{color:var(--green)} .fb.ko .t{color:var(--red)}
.fb .sol{font-family:var(--f-script);color:var(--ink);font-size:24px;line-height:1.7}
.transcript{font-size:16px;color:var(--muted);display:grid;gap:2px;text-align:left}
.transcript b{color:var(--text)}
.row{display:flex;gap:10px;justify-content:space-between;align-items:center;flex-wrap:wrap}
.stars{font-size:56px;letter-spacing:6px;text-align:center}
.score{font-size:28px;font-weight:700;text-align:center;font-variant-numeric:tabular-nums}
table{width:100%;border-collapse:collapse;font-size:16px;font-variant-numeric:tabular-nums}
td,th{padding:8px 6px;border-bottom:1px solid var(--line);text-align:left}
th{font-size:13px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
textarea{font:13px ui-monospace,Menlo,monospace;width:100%;box-sizing:border-box;min-height:110px;border:1.5px solid var(--line);border-radius:10px;background:var(--card);color:var(--text);padding:10px}
.warn{background:var(--red-2);border:1.5px solid var(--red);border-radius:12px;padding:10px 14px;font-size:15px}
.newword{font-size:15px;color:var(--muted)}
.testcard{grid-column:1/-1;border:2.5px solid var(--gold);min-height:0}
.plus{font-weight:700;color:var(--green)}
.ptsnow{color:var(--text)}
.bar{height:14px;background:var(--ink-2);border-radius:99px;overflow:hidden}
.bar>i{display:block;height:100%;background:var(--gold);border-radius:99px}
.nextani{display:flex;align-items:center;gap:14px;background:var(--card);border:1.5px solid var(--line);border-radius:var(--r);padding:12px 16px}
.nextani .em{font-size:48px;line-height:1;filter:grayscale(1) brightness(0);opacity:.22}
.earn{text-align:center;font-size:20px;font-weight:700;color:var(--green)}
.newani{display:grid;justify-items:center;gap:4px;background:var(--ink-2);border:2.5px solid var(--gold);border-radius:var(--r);padding:16px;text-align:center}
.newani .em{font-size:110px;line-height:1.1;animation:pop .7s ease-out}
@keyframes pop{0%{transform:scale(.2) rotate(-20deg);opacity:0}70%{transform:scale(1.15) rotate(6deg);opacity:1}100%{transform:scale(1)}}
.album{display:grid;grid-template-columns:repeat(auto-fill,minmax(128px,1fr));gap:12px}
.ani{background:var(--card);border:1.5px solid var(--line);border-radius:var(--r);padding:14px 8px;display:grid;justify-items:center;gap:2px;text-align:center}
.ani .em{font-size:58px;line-height:1.15}
.ani .fr{font-family:var(--f-script);color:var(--ink);font-size:19px;line-height:1.7}
body.print .ani .fr, body.print .newani .fw{font-family:var(--f-ui);font-weight:700;line-height:1.3}
.ani.locked{background:transparent;border-style:dashed}
.hwbanner{display:flex;align-items:center;gap:14px;background:var(--orange-2);border:2px solid var(--orange);border-radius:var(--r);padding:12px 16px}
.hwbanner .em{font-size:44px;line-height:1}
.hwbanner b{color:var(--orange)}
.newhw{background:var(--orange-2);border-color:var(--orange)}
.newhw .ask{color:var(--orange);font-weight:700}
.newhw .fw{color:var(--night)}
.hwalbum .ani:not(.locked){background:var(--orange-2);border-color:var(--orange)}
.hwalbum .ani:not(.locked) .fr{color:var(--night)}
.hwtitle{color:var(--orange)}
.cards.two{grid-template-columns:1fr 1fr}
@media (max-width:620px){.cards.two{grid-template-columns:1fr}}
.vh{position:absolute;width:1px;height:1px;opacity:0;overflow:hidden}
.camlbl{position:relative;cursor:pointer}
.camlbl:focus-within{outline:3px solid var(--gold);outline-offset:2px}
.phbox{display:grid;gap:12px}
.phimg{max-width:100%;max-height:320px;justify-self:center;border-radius:12px;border:1.5px solid var(--line)}
.checking{text-align:center;font-weight:700;color:var(--ink);padding:10px}
.fb.mid{background:var(--orange-2);border:1.5px solid var(--orange)}
.fb.mid .t{color:var(--orange)}
.keyin{font:inherit;padding:10px;border:1.5px solid var(--line);border-radius:10px;background:var(--card);color:var(--text);width:100%;box-sizing:border-box}
.ani.locked .em{filter:grayscale(1) brightness(0);opacity:.18}
.timer{font-variant-numeric:tabular-nums;min-width:118px}
.timer.idle{background:var(--ink);color:var(--paper);border-color:var(--ink);font-weight:700}
.timer.warn{border-color:var(--red);color:var(--red);background:var(--red-2);font-weight:700}
.startbig{justify-self:start}
#lock{position:fixed;inset:0;z-index:50;background:var(--veil);display:grid;place-items:center;padding-block:max(16px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-bottom,0px));padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.lockbox{background:var(--card);border:2px solid var(--ink);border-radius:20px;padding:28px 22px;max-width:460px;width:100%;box-sizing:border-box;text-align:center;display:grid;gap:14px}
.locktxt{font-size:22px;margin:0}
#b-parent{justify-self:center;font-size:14px;color:var(--muted);user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;touch-action:none}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>

</head>
<body>
<div class="wrap" id="app"></div>
<div id="lock" hidden role="dialog" aria-modal="true" aria-labelledby="locktitle"><div class="lockbox">
  <div class="big">🌟</div>
  <div class="fw" id="locktitle">C'est fini pour aujourd'hui !</div>
  <p class="locktxt">Per oggi hai lavorato abbastanza, brava!<br>Chiama <b>papà</b> o <b>mamma</b>.</p>
  <div class="note" id="locksum"></div>
  <button id="b-parent" class="chip">Solo per papà e mamma: tieni premuto 3 secondi</button>
  <div id="parentopts" hidden class="row" style="justify-content:center"><button class="btn ghost" data-extra="5">+5 minuti</button><button class="btn" data-extra="15">+15 minuti</button></div>
</div></div>

<script>
/* ===== DATI (modificabili: aggiungi qui le parole delle nuove unità) ===== */
const GOMME='<svg width="64" height="44" viewBox="0 0 64 44" aria-label="gomma"><rect x="4" y="8" width="56" height="28" rx="6" fill="#f4a3b6" stroke="#7a3a4a" stroke-width="2"/><rect x="34" y="8" width="26" height="28" rx="6" fill="#5a8be0" stroke="#7a3a4a" stroke-width="2"/></svg>';
const V=[ // nomi: u=unità, g=genere
 {fr:'frère',g:'m',u:2,it:'il fratello',e:'👦'},
 {fr:'sœur',g:'f',u:2,it:'la sorella',e:'👧'},
 {fr:'chien',g:'m',u:2,it:'il cane',e:'🐶'},
 {fr:'chat',g:'m',u:2,it:'il gatto',e:'🐱'},
 {fr:'hamster',g:'m',u:2,it:'il criceto',e:'🐹'},
 {fr:'dragon',g:'m',u:2,it:'il drago',e:'🐉'},
 {fr:'perruche',g:'f',u:2,it:'il pappagallino',e:'🦜'},
 {fr:'poisson rouge',g:'m',u:2,it:'il pesce rosso',e:'🐠'},
 {fr:'tortue',g:'f',u:2,it:'la tartaruga',e:'🐢'},
 {fr:'crayon',g:'m',u:3,it:'la matita',e:'✏️'},
 {fr:'gomme',g:'f',u:3,it:'la gomma',svg:GOMME},
 {fr:'stylo',g:'m',u:3,it:'la penna',e:'🖊️'},
 {fr:'règle',g:'f',u:3,it:'la riga',e:'📏'},
 {fr:'livre',g:'m',u:3,it:'il libro',e:'📖'},
 {fr:'trousse',g:'f',u:3,it:"l'astuccio",e:'👝'}
];
const COL=[ // colori (Unité 3) – solo forma maschile, come sul quaderno
 {fr:'blanc',it:'bianco',c:'#ffffff'},{fr:'bleu',it:'blu',c:'#2f6fd6'},{fr:'noir',it:'nero',c:'#151515'},
 {fr:'rouge',it:'rosso',c:'#e23b2e'},{fr:'jaune',it:'giallo',c:'#f2c81c'},{fr:'vert',it:'verde',c:'#2e9b4a'}
];
const NUM=['un','deux','trois','quatre','cinq','six','sept','huit','neuf','dix'];
const PHR=[
 {fr:'Bonjour monsieur !',it:'Buongiorno signore!',u:1},{fr:'Bonjour madame !',it:'Buongiorno signora!',u:1},
 {fr:'Salut !',it:'Ciao!',u:1},{fr:'Au revoir !',it:'Arrivederci!',u:1},{fr:'Ça va ?',it:'Come va?',u:1},
 {fr:"Je m'appelle Gloria.",it:'Mi chiamo Gloria.',u:1},{fr:"Comment tu t'appelles ?",it:'Come ti chiami?',u:2},
 {fr:'Tu as quel âge ?',it:'Quanti anni hai?',u:2},{fr:"J'ai huit ans.",it:'Ho otto anni.',u:2},
 {fr:"Je n'ai pas de frère.",it:'Non ho fratelli.',u:2},{fr:"Qu'est-ce que c'est ?",it:"Cos'è?",u:3}
];
const MOI=[ // domande su di sé (Scrittura)
 {u:1,q:"Comment tu t'appelles ?",it:'Come ti chiami?',a:["Je m'appelle Gloria."]},
 {u:1,q:'Ça va ?',it:'Come va?',a:['Oui, ça va.','Ça va.']},
 {u:2,q:'Tu as quel âge ?',it:'Quanti anni hai? (scrivi il numero in lettere)',a:["J'ai huit ans."]},
 {u:2,q:'Tu as un frère ?',it:'Hai un fratello?',a:["Non, je n'ai pas de frère.","Je n'ai pas de frère."]},
 {u:2,q:'Tu as une sœur ?',it:'Hai una sorella? (une = una)',a:["Oui, j'ai une sœur.","J'ai une sœur."]},
 {u:2,q:"Ta sœur s'appelle comment ?",it:'Come si chiama tua sorella?',a:["Elle s'appelle Giulia."]}
];
const FILL=[ // completa
 {u:1,b:'',a:'Ça',e:' va ? Oui, ça va.',it:'Come va? Sì, va bene.'},
 {u:1,b:'Au ',a:'revoir',e:' !',it:'Arrivederci!'},
 {u:1,b:"Je m'",a:'appelle',e:' Gloria.',it:'Mi chiamo Gloria.'},
 {u:1,b:"Comment tu t'",a:'appelles',e:' ?',it:'Come ti chiami?'},
 {u:1,b:'Giulia s’',a:'appelle',e:'.',it:'Giulia si chiama.'},
 {u:2,b:"J'ai deux frère",a:'s',e:'.',it:'Ho due fratelli. (manca una lettera!)'},
 {u:2,b:"Je n'ai pas ",a:'de',e:' frère.',it:'Non ho fratelli.'},
 {u:2,b:"J'ai ",a:'une',e:' sœur.',it:'Ho una sorella.'},
 {u:3,b:"Qu'est-ce que c'",a:'est',e:' ?',it:"Cos'è?"}
];
const DLG=[ // dialoghi per l'ascolto (c = bambino, f = donna, m = uomo)
 {u:[1,2],l:[['Léo','c',"Salut ! Je m'appelle Léo."],['Léo','c',"J'ai neuf ans."],['Léo','c',"J'ai un frère et un chien."]],
  q:[{q:'Come si chiama il bambino?',o:['Léo','Luca','Lino'],a:0},{q:'Quanti anni ha Léo?',o:['7','8','9'],a:2},{q:'Che animale ha Léo?',o:['🐶','🐱','🐢'],a:0,pic:1}]},
 {u:[1,2],l:[['Mia','c',"Bonjour ! Je m'appelle Mia."],['Mia','c',"J'ai huit ans."],['Mia','c',"Je n'ai pas de frère. J'ai une sœur et une tortue."]],
  q:[{q:'Mia ha un fratello?',o:['Sì','No'],a:1},{q:'Che animale ha Mia?',o:['🐹','🐢','🦜'],a:1,pic:1},{q:'Quanti anni ha Mia?',o:['6','8','10'],a:1}]},
 {u:[1,2],l:[['Giulia','c',"Salut ! Je m'appelle Giulia."],['Giulia','c',"J'ai six ans."],['Giulia','c',"Ma sœur s'appelle Gloria."]],
  q:[{q:'Quanti anni ha Giulia?',o:['5','6','8'],a:1},{q:'Come si chiama la sorella di Giulia?',o:['Mia','Gloria','Valentina'],a:1}]},
 {u:[1],l:[['Papa Marco','m','Je compte les ballons de foot : un, deux, trois, quatre, cinq, six, sept !']],nw:'ballon = pallone',
  q:[{q:'Quanti palloni conta papà Marco?',o:['6','7','8'],a:1}]},
 {u:[1],l:[['Papa Marco','m','Bonjour madame ! Ça va ?'],['Maman Valentina','f','Oui, ça va ! Au revoir !']],
  q:[{q:'Come sta mamma Valentina?',o:['Bene 🙂','Male 🙁'],a:0},{q:'Alla fine mamma Valentina dice…',o:['Ciao, come va?','Arrivederci!'],a:1}]},
 {u:[3],l:[['Maman Valentina','f',"Gloria, qu'est-ce que c'est ?"],['Gloria','c',"C'est ma trousse rouge."]],
  q:[{q:"Che cos'è?",o:[['trousse','rouge'],['trousse','jaune'],['stylo','rouge']],a:0,obj:1}]},
 {u:[3],l:[['Giulia','c',"Gloria, qu'est-ce que c'est ?"],['Gloria','c',"C'est mon crayon vert."]],
  q:[{q:"Che cos'è?",o:[['crayon','vert'],['stylo','vert'],['crayon','bleu']],a:0,obj:1}]}
];
/* oggetti + colori senza problemi di accordo (maschili con tutti i colori; femminili solo con rouge/jaune) */
const OBJ_M=['crayon','stylo','livre'], OBJ_F=['trousse','gomme','règle'], COL_INV=['rouge','jaune'];

/* ===== STATO ===== */
const KEY='gloria-fr-v1';
let S={units:[1,2,3],stats:{},history:[],script:true,slow:false,points:0,seen:0,hw:0};
try{const s=JSON.parse(localStorage.getItem(KEY)||'null'); if(s) S=Object.assign(S,s);}catch(e){}
function localSave(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
function save(){localSave(); markDirty();}
let DEV=null; try{DEV=localStorage.getItem('gloria-fr-dev')}catch(e){}

function build(kind,n=8){

  const qs=[],seen=new Set(); let guard=0;
  while(qs.length<n&&guard++<200){
    const tot=pools.reduce((s,p)=>s+p[0],0); let r=Math.random()*tot, f=pools[0][1];
    for(const p of pools){if((r-=p[0])<0){f=p[1];break}}
    const q=f(); if(seen.has(q.key+q.ask)&&guard<150) continue; seen.add(q.key+q.ask); qs.push(q);
  }
  return qs;
}

function check(){

  }
  if(!ok&&q.noun&&norm(v,0)===norm(q.noun,0)) run.note='Manca l\'articolo: le o la?';
  if(!ok&&q.ans.some(a=>norm(v,0).replace(/[^a-z']/g,'')===norm(a,0).replace(/[^a-z']/g,''))){ok=true;run.note='Giusto! Controlla solo spazi e apostrofi.'}

}
/* ===== TIMER: 15 minuti al giorno ===== */
const LIMIT=15*60*1000;
const today=()=>{const d=new Date();return d.getFullYear()+'-'+(d.getMonth()+1)+'-'+d.getDate()};
function T(){if(!S.t||S.t.day!==today())S.t={day:today(),used:0,run:false,extra:0};return S.t}
const left=()=>{const t=T();return Math.max(0,LIMIT+t.extra-t.used)};
const fmt=ms=>{const s=Math.ceil(ms/1000);return Math.floor(s/60)+':'+String(s%60).padStart(2,'0')};
let lastTick=null;
function startTimer(){const t=T(); if(left()<=0){showLock();return false} if(!t.run){t.run=true;lastTick=Date.now();save()} return true}
function updTimer(){const b=$('#b-timer'); if(!b) return; const t=T(), l=left();
  b.className='chip timer'+(!t.run&&l>0?' idle':t.run&&l<60000?' warn':'');
  b.textContent=!t.run&&l>0?'▶ Inizia · '+fmt(l):l>0?'⏱ '+fmt(l):'⏱ 0:00';
  b.setAttribute('aria-label',t.run?'Tempo rimasto '+fmt(l):'Inizia il timer');}
function tick(){const t=T();
  if(t.run&&!document.hidden){const now=Date.now(); if(lastTick) t.used+=now-lastTick; lastTick=now;} else lastTick=null;
  if(t.run&&left()<=0){t.run=false; save(); showLock();}
  else if(t.run) save();
  updTimer();}
function showLock(){try{speechSynthesis.cancel()}catch(e){}
  const d=new Date().toLocaleDateString('it-CH'), n=S.history.filter(h=>String(h.d).startsWith(d)).length;
  $('#locksum').textContent=n?`Oggi hai completato ${n} ${n===1?'scheda':'schede'} ⭐`:'';
  $('#parentopts').hidden=true; $('#b-parent').hidden=false; $('#lock').hidden=false; updTimer();}
(function(){const b=$('#b-parent'); let h=null;
  const stop=()=>{clearTimeout(h);h=null;b.textContent='Solo per papà e mamma: tieni premuto 3 secondi'};
  b.addEventListener('pointerdown',e=>{e.preventDefault();b.textContent='Continua a tenere premuto…';h=setTimeout(()=>{h=null;b.hidden=true;$('#parentopts').hidden=false},3000)});
  ['pointerup','pointerleave','pointercancel'].forEach(ev=>b.addEventListener(ev,()=>{if(h)stop()}));
  b.addEventListener('contextmenu',e=>e.preventDefault());
  document.querySelectorAll('[data-extra]').forEach(x=>x.onclick=()=>{const t=T(); t.extra=Math.max(t.extra,t.used-LIMIT)+(+x.dataset.extra)*60000; t.run=true; lastTick=Date.now(); save(); $('#lock').hidden=true; stop(); updTimer();});
})();
setInterval(tick,1000);
document.addEventListener('visibilitychange',()=>{lastTick=null;if(!document.hidden&&T().run)lastTick=Date.now()});
/* ===== SALVATAGGIO ONLINE (Firebase) ===== */
const FBCFG={apiKey:"AIzaSyDVRjY_7fHfxmMnolhqnxzMN58xVVQ5ass",authDomain:"francais-gloria.firebaseapp.com",projectId:"francais-gloria",storageBucket:"francais-gloria.firebasestorage.app",messagingSenderId:"534405393040",appId:"1:534405393040:web:ffab17474ca4649354c615"};
const FBV='10.12.2';
let FB={state:'loading',user:null,last:null,err:''},fdb=null,fauth=null,dirty=false,pushT=null,syncing=null;
function loadScript(src){return new Promise((res,rej)=>{const e=document.createElement('script');e.src=src;e.onload=res;e.onerror=rej;document.head.appendChild(e)})}
async function initCloud(){
  try{for(const m of ['app','auth','firestore']) await loadScript(`https://www.gstatic.com/firebasejs/${FBV}/firebase-${m}-compat.js`);
    firebase.initializeApp(FBCFG); fauth=firebase.auth(); fdb=firebase.firestore();
    fauth.onAuthStateChanged(async u=>{FB.user=u; FB.state=u?'on':'off'; cloudUI(); if(u) await cloudSync();});
  }catch(e){FB.state='na'; cloudUI();}
}
function markDirty(){dirty=true; if(!pushT&&FB.user) pushT=setTimeout(()=>{pushT=null; if(dirty) cloudSync();},20000);}
function cloudPayload(){return {byDev:S.byDev,hwBy:S.hwBy,seen:S.seen||0,stats:S.stats,history:S.history.slice(-300),t:S.t||null,units:S.units}}
const hOrd=h=>{const m=String(h.d).match(/(\d+)\.(\d+)\.(\d+)\D+(\d+):(\d+)/);return m?+(m[3]+m[2].padStart(2,'0')+m[1].padStart(2,'0')+m[4].padStart(2,'0')+m[5]):0};
function mergeInto(r){if(!r||typeof r!=='object') return;
  const mx=(a,b)=>{const o={...a};for(const k in (b||{})) o[k]=Math.max(+o[k]||0,+b[k]||0);return o};
  S.byDev=mx(S.byDev,r.byDev); S.hwBy=mx(S.hwBy,r.hwBy); S.seen=Math.max(S.seen||0,+r.seen||0);
  for(const k in (r.stats||{})){const a=S.stats[k]||{ok:0,ko:0},b=r.stats[k]||{};S.stats[k]={ok:Math.max(a.ok,+b.ok||0),ko:Math.max(a.ko,+b.ko||0)}}
  const have=new Set(S.history.map(h=>[h.d,h.k,h.s,h.t].join('|')));
  (r.history||[]).forEach(h=>{const k=[h.d,h.k,h.s,h.t].join('|'); if(!have.has(k)){have.add(k);S.history.push(h)}});
  S.history.sort((a,b)=>hOrd(a)-hOrd(b));
  if(r.t&&r.t.day===today()){const t=T(); t.used=Math.max(t.used||0,+r.t.used||0); t.extra=Math.max(t.extra||0,+r.t.extra||0);}
  recalc();}
async function cloudSync(){if(!fdb||!FB.user) return; if(syncing) return syncing;
  const ref=fdb.collection('progress').doc(FB.user.uid);
  syncing=(async()=>{try{
    await fdb.runTransaction(async tx=>{const d=await tx.get(ref); if(d.exists){try{mergeInto(JSON.parse(d.data().data))}catch(e){}}
      tx.set(ref,{data:JSON.stringify(cloudPayload()),updated:firebase.firestore.FieldValue.serverTimestamp(),device:DEV});});
    dirty=false; FB.last=new Date(); FB.err=''; localSave();
  }catch(e){FB.err=e&&e.code==='permission-denied'?'Permesso negato: controlla le regole di Firestore.':e&&e.code==='unavailable'?'Senza internet: salvo appena torna la connessione.':'Salvataggio online non riuscito, riprovo più tardi.';}
  syncing=null; cloudUI(); if(screen!=='quiz') render(); updTimer();})();
  return syncing;}
async function cloudReset(){if(!fdb||!FB.user) return; try{await fdb.collection('progress').doc(FB.user.uid).set({data:JSON.stringify(cloudPayload()),updated:firebase.firestore.FieldValue.serverTimestamp(),device:DEV}); FB.last=new Date();}catch(e){} cloudUI();}
function cloudLine(){return FB.state==='on'?'☁️ Progressi salvati online: li ritrovi su ogni dispositivo.':FB.state==='off'?'☁️ Salvataggio online non attivo: papà o mamma accedono in 📊 Progressi.':''}
function authErr(c){return /invalid-credential|wrong-password|user-not-found|invalid-email|invalid-login/.test(c||'')?'Email o password sbagliate.':/network/.test(c||'')?'Nessuna connessione a internet.':/too-many/.test(c||'')?'Troppi tentativi: riprova tra qualche minuto.':/unauthorized-domain/.test(c||'')?'Dominio non autorizzato: aggiungi mo-foot.github.io in Firebase.':'Accesso non riuscito ('+(c||'errore')+').'}
function cloudHTML(){
  if(FB.state==='loading') return '<p class="note">Collegamento al salvataggio online…</p>';
  if(FB.state==='na') return '<p class="note">Salvataggio online non disponibile qui: serve internet e la versione dell\'app su mo-foot.github.io.</p>';
  if(FB.user) return `<p class="note">✓ Collegato come <b>${esc(FB.user.email||'')}</b>. Punti, animali e statistiche si salvano online.${FB.last?' Ultimo salvataggio: '+FB.last.toLocaleTimeString('it-CH',{hour:'2-digit',minute:'2-digit'})+'.':''}${FB.err?' <b>'+esc(FB.err)+'</b>':''}</p>
    <div class="row"><button class="btn ghost" id="b-logout">Esci</button><button class="btn" id="b-sync">Sincronizza ora</button></div>`;
  return `<p class="note">Accedi con l'account di famiglia per salvare i progressi online e ritrovarli su ogni dispositivo.</p>
    <input type="email" id="fb-mail" class="keyin" placeholder="Email" autocomplete="username" autocapitalize="off">
    <input type="password" id="fb-pw" class="keyin" placeholder="Password" autocomplete="current-password">
    <div class="row"><span class="note" id="fb-msg">${esc(FB.err)}</span><button class="btn" id="b-login">Accedi</button></div>`;}
function cloudUI(){const b=$('#cloudbox'); if(b&&!(b.contains(document.activeElement)&&document.activeElement.tagName==='INPUT')){b.innerHTML=cloudHTML(); bindCloud();} const l=$('#cloudline'); if(l) l.textContent=cloudLine();}
function bindCloud(){
  const li=$('#b-login'); if(li){const go=async()=>{const m=$('#fb-mail').value.trim(),pw=$('#fb-pw').value; if(!m||!pw) return; li.disabled=true; $('#fb-msg').textContent='Accesso…';
      try{FB.err=''; await fauth.signInWithEmailAndPassword(m,pw);}catch(e){FB.err=authErr(e&&e.code); const x=$('#fb-msg'); if(x) x.textContent=FB.err; li.disabled=false;}};
    li.onclick=go; const pw=$('#fb-pw'); if(pw) pw.onkeydown=e=>{if(e.key==='Enter')go()};}
  const lo=$('#b-logout'); if(lo) lo.onclick=async()=>{await cloudSync(); await fauth.signOut();};
  const sy=$('#b-sync'); if(sy) sy.onclick=()=>cloudSync();}
document.addEventListener('visibilitychange',()=>{if(!FB.user) return; if(document.hidden){if(dirty) cloudSync();} else cloudSync();});
render();
if(T().used>0&&left()<=0) showLock();
initCloud();
if("serviceWorker" in navigator){window.addEventListener("load",()=>{navigator.serviceWorker.register("sw.js").catch(e=>console.warn("Service Worker non registrato:",e.message))})}
</script>
